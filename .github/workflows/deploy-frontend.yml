name: Deploy frontend to GitHub Pages

# Publishes the static app_frontend/ folder to GitHub Pages on every push to
# main. The backend is NOT deployed here — it runs on your PC behind a tunnel.

on:
  push:
    branches: [main]
    paths: ["app_frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app_frontend
      - id: deployment
        uses: actions/deploy-pages@v4
